
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Component</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .circle {
            width: 70px;
            height: 70px;
            border: 3px solid #d3d3d3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #777;
            background-color: white;
            position: relative;
            z-index: 2;
        }

        .circle.active {
            border-color: #3498db;
            background-color: #3498db;
            color: white;
        }

        .progress-line {
            width: 340px;
            height: 4px;
            background-color: #d3d3d3;
            position: absolute;
            z-index: 1;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: #3498db;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #d3d3d3;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Progress Line -->
        <div class="progress-line">
            <div class="progress"></div>
        </div>

        <!-- Circles -->
        <div class="circle active" id="circle-1">1</div>
        <div class="circle" id="circle-2">2</div>
        <div class="circle" id="circle-3">3</div>
        <div class="circle" id="circle-4">4</div>
        <div class="circle" id="circle-5">5</div>

    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button id="prev" disabled>Previous</button>
        <button id="next">Next</button>
    </div>

    <script src="./script.js"></script>

</body>

</html>
